function moneyFix(el){

function rowFor(k,o){
 var coll=k.split('/')[0],base=[o.id,o.updated,o.deleted?1:0];

   cell((o.items||[]).map(function(i){return i.name+' x'+(i.qty||1)+' @'+i.price;}).join('; ')),c.jasa,c.partRev,c.partCost,c.total,isFront()?'':(isPaid(o)?Math.round(c.tech):0),0,isFront()?'':(isPaid(o)?Math.round(c.shop):0),o.warrantyDays||0,(w&&w.until)||'',(o.claims||[]).length,js]);}
 if(coll==='tb')return base.concat([+o.year||0,mlabel(o.month),'Ditutup',+o.nUnit||0,Math.round(o.total||0),Math.round(o.net||0),Math.round(o.tech||0),Math.round(o.base||0),Math.round(o.adminBonus||0),Math.round(o.rajin||0),Math.round(o.exp||0),Math.round(o.claimCost||0),Math.round(o.netShop||0),Math.round(o.saldo||0),o.closedAt||'',js]);
 if(coll==='kas'){var sk=staff(o.staffId);return base.concat([o.date,sk?sk.name:o.staffId,o.kind==='potong'?'Potong gaji':'Kasbon',+o.amount||0,cell(o.note),js]);}
 if(coll==='exp')return base.concat([o.date,cell(o.cat),cell(o.note),+o.amount||0,js]);
 return base.concat(['Pengaturan toko',js]);}
function post(url,body){

function syncLabel(){
 if(!hasServer())return{c:'',t:AUTH&&AUTH.local?'Mode lokal · belum terhubung ke Google Sheets':'Belum terhubung ke Google Sheets'};
 var n=pendingCount();
 if(SYNC.state==='busy')return{c:'wait',t:'Menyinkronkan…'};
 if(SYNC.state==='error')return{c:'err',t:'Gagal sinkron · '+n+' menunggu · ketuk untuk detail'};
 if(SYNC.state==='offline')return{c:'wait',t:'Offline · '+n+' menunggu sinkron'};
 if(n)return{c:'wait',t:n+' data menunggu sinkron'};
 return{c:'ok',t:'Tersinkron ke Google Sheets'+(SYNC.last?' · '+new Date(SYNC.last).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'')};}
function statusRefresh(){var b=document.querySelector('.sub');if(!b)return;var sl=syncLabel();b.className='sub '+sl.c;b.innerHTML='<span class="dot"></span>'+esc(sl.t);}
async function syncNow(manual){
 if(!hasServer()){if(manual)toast(isAdmin()?'Hubungkan dulu di Atur › Google Sheets, lalu masuk dengan akun Owner.':'Belum terhubung ke server.');return;}
 if(syncing)return;
 if(typeof navigator.onLine==='boolean'&&!navigator.onLine){SYNC.state='offline';statusRefresh();if(manual)toast('Perangkat offline. Data disinkronkan saat tersambung.');return;}
 syncing=true;SYNC.state='busy';statusRefresh();var changed=false;
 try{
  var by={tx:[],exp:[],cfg:[],kas:[],tb:[]};
  if(!canWrite())SYNC.pending={};
  Object.keys(SYNC.pending).forEach(function(k){if(!DOCS[k]){delete SYNC.pending[k];return;}var c=k.split('/')[0];if(by[c])by[c].push(k);});
  for(var coll in by){var ks=by[coll];
   for(var i=0;i<ks.length;i+=40){var part=ks.slice(i,i+40),snap={};
    part.forEach(function(k){snap[k]=DOCS[k].updated;});
    var r=await api({action:'push',coll:coll,headers:HEAD[coll],docs:part.map(function(k){return{row:rowFor(k,DOCS[k])};})});
    if(!r||!r.ok)throw new Error((r&&r.error)||'push');
    part.forEach(function(k){if(DOCS[k]&&DOCS[k].updated===snap[k])delete SYNC.pending[k];});
    saveSync();}}
  /* since mundur 10 menit: jaga-jaga jam antar-perangkat tidak persis sama (data yang sama dilewati otomatis). */
  var pr=await api({action:'pull',since:Math.max(0,SYNC.since-600000)});
  if(!pr||!pr.ok)throw new Error((pr&&pr.error)||'pull');
  var maxU=SYNC.since;
  (pr.docs||[]).forEach(function(d){
   if(d.updated>maxU)maxU=d.updated;
   var loc=DOCS[d.k];if(loc&&loc.updated>=d.updated)return;
   var o;try{o=JSON.parse(d.json);}catch(e){return;}
   o.updated=d.updated;if(d.deleted)o.deleted=true;DOCS[d.k]=o;persist(d.k);delete SYNC.pending[d.k];changed=true;});
  SYNC.since=maxU;SYNC.last=Date.now();SYNC.state='idle';SYNC.err='';saveSync();
  if(changed)rebuild();
  if(changed&&isAdmin())snapRates();
  if(isTech())sopFlush();
  if(manual)toast('Sinkronisasi selesai.');
 }catch(e){
  SYNC.state='error';SYNC.err=(e&&e.message)||'gagal';
  if(SYNC.err==='auth'){SYNC.state='idle';syncing=false;toast('Sesi berakhir. Silakan masuk lagi.');sessionExpired();return;}
  if(manual)toast(/^(token|action|forbidden)$/.test(SYNC.err)?errMsg(SYNC.err):'Sinkronisasi gagal. Periksa koneksi internet.');
 }
 syncing=false;statusRefresh();
 if((changed||tab==='atur')&&!typing()&&!sigPad.drawing)render();}

/* RUMUS FINAL:
 Laba bersih = total nota - modal sparepart
 Bagi hasil teknisi = laba bersih x share%
 Toko awal = laba bersih - bagi hasil
 Fee unit = toko awal x fee%
 Total teknisi = bagi hasil + fee
 Sisa toko = toko awal - fee */
function calc(t){
 var jasa=0,pr=0,pc=0;
 (t.items||[]).forEach(function(i){var q=+i.qty||1;if(i.type==='jasa')jasa+=q*(+i.price||0);else{pr+=q*(+i.price||0);pc+=q*(+i.cost||0);}});
 var total=jasa+pr,net=Math.max(0,total-pc),s=staff(t.techId),isT=!!(s&&s.role!=='admin');
 var share=(t.share!=null)?num(t.share):(isT?num(s.share):0);
 var fee=(t.fee!=null)?num(t.fee):(isT?num(s.fee):0);
 var bh=net*share/100,shop0=net-bh,feeAmt=shop0*fee/100;
 return{jasa:jasa,partRev:pr,partCost:pc,total:total,net:net,share:share,fee:fee,bh:bh,shop0:shop0,feeAmt:feeAmt,tech:bh+feeAmt,shop:shop0-feeAmt};}

function monthStats(m){
 var F=txs.filter(function(t){return isActive(t)&&isPaid(t)&&inM(payDate(t),m);});
 var W=txs.filter(function(t){return isActive(t)&&statusOf(t)==='Selesai';});
 var E=exps.filter(function(e){return inM(e.date,m);});
 var a={nMasuk:0,nProses:0,nSelesai:F.length,nTunggu:W.length,tungguTotal:W.reduce(function(x,t){return x+calc(t).total;},0),tungguTech:W.reduce(function(x,t){return x+calc(t).tech;},0),nBatal:0,total:0,jasa:0,partRev:0,partCost:0,net:0,bh:0,feeAmt:0,tech:0,shop0:0,shop:0,byTech:{},byCat:{},days:{},claimCost:0,claimN:0,exp:0,expN:E.length,E:E,refundN:0,refundAmt:0};
 function bt(id){return a.byTech[id]||(a.byTech[id]={masuk:0,proses:0,selesai:0,batal:0,net:0,bh:0,feeAmt:0,tech:0,shop:0});}
 function dr(d){return a.days[d]||(a.days[d]={masuk:0,selesai:0,batal:0,total:0,net:0,tech:0,shop:0});}
 txs.forEach(function(t){
  if(inM(t.date,m)){a.nMasuk++;bt(t.techId).masuk++;dr(t.date).masuk++;if(isProc(t)){a.nProses++;bt(t.techId).proses++;}}
  if(!isActive(t)&&inM(cancelDate(t),m)){a.nBatal++;bt(t.techId).batal++;dr(cancelDate(t)).batal++;}
 });
 F.forEach(function(t){var c=calc(t),b=bt(t.techId),d=dr(payDate(t));
  a.total+=c.total;a.jasa+=c.jasa;a.partRev+=c.partRev;a.partCost+=c.partCost;a.net+=c.net;a.bh+=c.bh;a.feeAmt+=c.feeAmt;a.tech+=c.tech;a.shop0+=c.shop0;a.shop+=c.shop;
  b.selesai++;b.net+=c.net;b.bh+=c.bh;b.feeAmt+=c.feeAmt;b.tech+=c.tech;b.shop+=c.shop;
  d.selesai++;d.total+=c.total;d.net+=c.net;d.tech+=c.tech;d.shop+=c.shop;});
 txs.forEach(function(t){(t.claims||[]).forEach(function(c){if(claimOK(c)&&inM(c.date,m)){a.claimN++;
   if(c.result===REFUND){var r=calc(t),b2=bt(t.techId);a.refundN++;a.refundAmt+=r.total;a.claimCost+=r.partCost;
    a.total-=r.total;a.jasa-=r.jasa;a.partRev-=r.partRev;a.net-=r.net;a.bh-=r.bh;a.feeAmt-=r.feeAmt;a.tech-=r.tech;a.shop0-=r.shop0;a.shop-=r.shop;
    b2.net-=r.net;b2.bh-=r.bh;b2.feeAmt-=r.feeAmt;b2.tech-=r.tech;b2.shop-=r.shop;b2.refund=(b2.refund||0)+1;}
   else a.claimCost+=+c.cost||0;}});});
 E.forEach(function(e){a.exp+=+e.amount||0;a.byCat[e.cat]=(a.byCat[e.cat]||0)+(+e.amount||0);});
 a.base=admins().reduce(function(x,s){return x+(+s.base||0);},0);
 a.adminUnit=(F.length-a.refundN)*(+cfg.adminUnitFee||0);
 a.adminOmzet=a.net*num(cfg.adminOmzetRate)/100;
 a.adminBonus=a.adminUnit+a.adminOmzet;
 a.rajinPool=a.shop*num(cfg.rajinRate)/100;
 var pr=0;cfg.staff.forEach(function(s){if(cfg.rajinCheck&&cfg.rajinCheck[m+'|'+s.id])pr+=a.rajinPool;});
 a.totalRajinPaid=pr;
 a.payroll=a.base+a.tech+a.adminBonus+pr;
 a.netShop=a.shop-a.base-a.adminBonus-pr-a.exp-a.claimCost;
 a.ratio=a.net>0?a.payroll/a.net:0;
 return a;}

function dayStats(d){
 var o={masuk:0,proses:0,selesai:0,diambil:0,batal:0,total:0,net:0,bh:0,feeAmt:0,tech:0,shop:0,byTech:{}};
 function bt(id){return o.byTech[id]||(o.byTech[id]={masuk:0,proses:0,selesai:0,diambil:0,batal:0,net:0,bh:0,feeAmt:0,tech:0});}
 txs.forEach(function(t){

function initSigPad(){
 var cv=document.getElementById('sig-canvas');if(!cv)return;
 var r=cv.getBoundingClientRect();cv.width=Math.max(200,Math.round(r.width));cv.height=130;
 var x=cv.getContext('2d');x.strokeStyle='#111';x.lineWidth=2.5;x.lineCap='round';x.lineJoin='round';
 if(draft.signature){var im=new Image();im.onload=function(){x.drawImage(im,0,0,cv.width,cv.height);};im.src=draft.signature;}
 var pos=function(e){var b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top];};
 cv.onpointerdown=function(e){sigPad.drawing=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}var p=pos(e);x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+0.1,p[1]);x.stroke();e.preventDefault();};
 cv.onpointermove=function(e){if(!sigPad.drawing)return;var p=pos(e);x.lineTo(p[0],p[1]);x.stroke();e.preventDefault();};
 var end=function(){if(!sigPad.drawing)return;sigPad.drawing=false;
  var s=document.createElement('canvas');s.width=300;s.height=100;var sc=s.getContext('2d');sc.fillStyle='#fff';sc.fillRect(0,0,300,100);sc.drawImage(cv,0,0,300,100);
  draft.signature=s.toDataURL('image/png');};
 cv.onpointerup=end;cv.onpointercancel=end;}

function sopNeed(){return SOP_VER+'.'+(+cfg.sopRev||0);}
function sopRec(){try{return JSON.parse(localStorage.getItem('kp-sop-'+(AUTH&&AUTH.user))||'null');}catch(e){return null;}}
function sopSaveRec(r){try{localStorage.setItem('kp-sop-'+AUTH.user,JSON.stringify(r));}catch(e){}}
function sopDays(){var d=cfg.sopDays;return d==null?30:+d||0;}
function sopFresh(r,days){return !!r&&r.ver===sopNeed()&&(!days||(Date.now()-(+r.at||0))<days*86400000);}
function sopOKv(){return sopFresh(sopRec(),sopDays());}
function needSop(){return isTech()&&!sopOKv();}
function sopLeft(){var r=sopRec(),d=sopDays();if(!r||!d||r.ver!==sopNeed())return null;return Math.ceil((r.at+d*86400000-Date.now())/86400000);}
function sopBoot(){
 /* Ambil status baca dari server (agar perangkat kedua tidak diminta ulang); jika gagal, pakai catatan di perangkat. */
 if(!hasServer())return;
 sopD.checking=true;
 var tm=new Promise(function(res){setTimeout(function(){res(null);},7000);});
 Promise.race([api({action:'sop_me'}).catch(function(){return null;}),tm]).then(function(r){
  sopD.checking=false;
  if(r&&r.ok&&r.ver){var loc=sopRec();if(!loc||(+r.at||0)>(+loc.at||0))sopSaveRec({ver:r.ver,at:+r.at||Date.now()});}
  render();sopFlush();});}
function sopFlush(){
 var r=sopRec();if(!r||!r.pending||!hasServer())return;
 api({action:'sop_ack',ver:r.ver}).then(function(x){if(x&&x.ok){var c=sopRec();if(c&&c.pending&&c.ver===r.ver)sopSaveRec({ver:c.ver,at:+x.at||c.at});}}).catch(function(){});}
function sopAck(){
 if(sopD.busy||!sopReady())return;
 sopD.busy=true;sopD.err='';sopUpdate();
 var need=sopNeed();
 var done=function(rec,msg){sopD.busy=false;sopSaveRec(rec);sopD.quiz={};sopD.checked=false;sopD.reached=false;sopD.t0=0;tab='t-ringkas';render();window.scrollTo(0,0);toast(msg);};
 api({action:'sop_ack',ver:need}).then(function(r){
  if(r&&r.ok)done({ver:need,at:+r.at||Date.now()},'Terima kasih. Persetujuan SOP Anda tercatat.');
  else if(r&&r.error==='auth'){sopD.busy=false;sessionExpired();}
  else done({ver:need,at:Date.now(),pending:true},'Tersimpan di perangkat. Server belum diperbarui atau sedang tidak terjangkau.');
 }).catch(function(){done({ver:need,at:Date.now(),pending:true},'Tersimpan di perangkat dan akan dikirim saat tersambung internet.');});}

function saveAuth(){try{localStorage.setItem('kp-auth',JSON.stringify(AUTH));}catch(e){}}
function loadAuth(){try{var a=JSON.parse(localStorage.getItem('kp-auth')||'null');if(a&&(a.local||(a.session&&(a.role==='admin'||a.role==='front'||a.role==='teknisi'))))AUTH=a;}catch(e){}}
function sessionExpired(){var u=AUTH&&AUTH.user;try{localStorage.removeItem('kp-auth');}catch(e){}AUTH=null;loginD.user=u&&u!=='lokal'?u:'';loginD.pass='';loginD.err='Sesi berakhir. Silakan masuk lagi.';render();}
async function doLogin(){
 if(loginD.busy)return;
 var url=(loginD.editUrl||!SYNC.url?loginD.url:SYNC.url).trim(),u=String(loginD.user||'').trim().toLowerCase(),p=loginD.pass||'';
 if(!/^https:\/\/script\.google\.com\//.test(url)){loginD.err='Alamat server harus diawali https://script.google.com/';render();return;}
 if(!u||!p){loginD.err='Isi username dan sandi.';render();return;}
 loginD.busy=true;loginD.err='';render();
 try{
  var r=await post(url,{action:'login',user:u,pass:p});
  if(!r||!r.ok){loginD.busy=false;loginD.err=errMsg(r&&r.error);loginD.pass='';render();return;}
  var key='kp-sync'+(r.role==='teknisi'?'-'+r.user:''),o={};
  try{o=JSON.parse(localStorage.getItem(key)||'{}');}catch(e){}
  o.url=url;delete o.token;localStorage.setItem(key,JSON.stringify(o));
  if(r.role==='teknisi'){try{var o2=JSON.parse(localStorage.getItem('kp-sync')||'{}');o2.url=url;localStorage.setItem('kp-sync',JSON.stringify(o2));}catch(e){}}
  AUTH={user:r.user,name:r.name,role:r.role,staffId:r.staffId,session:r.session,local:false};saveAuth();
  loginD.pass='';location.reload();
 }catch(e){loginD.busy=false;loginD.err='Tidak dapat menghubungi server. Periksa internet dan alamat server.';render();}}
function doLogout(){
 if(!AUTH||AUTH.local)return;
 if(!logoutArmed){logoutArmed=true;render();
  if(canWrite()&&pendingCount())toast(pendingCount()+' data belum tersinkron. Ketuk lagi jika tetap ingin keluar.');
  setTimeout(function(){if(logoutArmed){logoutArmed=false;if(AUTH)render();}},4000);return;}
 var wipe=isTech()||isFront(),u=AUTH.user;
 try{localStorage.removeItem('kp-auth');}catch(e){}
 if(!wipe){location.reload();return;}
 /* Akun teknisi: hapus salinan data di perangkat ini saat keluar. */
 try{localStorage.removeItem('kp-sync-'+u);localStorage.removeItem('kp-fallback-'+u);}catch(e){}
 try{if(IDB)IDB.close();}catch(e){}
 var done=false,go=function(){if(done)return;done=true;location.reload();};
 try{var rq=indexedDB.deleteDatabase('kasir-pro-'+u);rq.onsuccess=rq.onerror=rq.onblocked=go;}catch(e){go();}
 setTimeout(go,1500);}
