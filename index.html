<!doctype html>
<html lang="id" data-tema="hijau">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kasir Servis Pro - ADOB CELL</title>
<meta name="theme-color" content="#EBEFEA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
<style>
:root,[data-tema=hijau]{--bg:#EBEFEA;--surface:#fff;--surface2:#F4F7F3;--fg:#16211D;--muted:#586861;--line:#D3DBD4;--accent:#0B7A5A;--accent-fg:#fff;--accent-soft:#D6EEE4;--good:#1B7F4B;--warn:#9A5B00;--bad:#B3261E;--good-soft:#D8EFDF;--warn-soft:#F8E9CC;--bad-soft:#F7DEDB;--r:8px;--rs:6px;--bw:1px;--f-d:'Archivo',system-ui,sans-serif;--f-b:'IBM Plex Sans',system-ui,sans-serif;--f-m:'IBM Plex Mono',ui-monospace,monospace}
[data-tema=malam]{--bg:#0F1613;--surface:#17211D;--surface2:#1D2924;--fg:#E6EEE9;--muted:#97A99F;--line:#2B3B34;--accent:#3DD6A3;--accent-fg:#04281C;--accent-soft:#12372B;--good:#4CCB8B;--warn:#E3A53B;--bad:#F28B82;--good-soft:#13341F;--warn-soft:#3A2D12;--bad-soft:#3D1F1D;color-scheme:dark}
[data-tema=samudra]{--bg:#E7EEF7;--surface:#fff;--surface2:#F1F6FC;--fg:#0F2036;--muted:#53657B;--line:#CBD8E6;--accent:#0A5FD0;--accent-fg:#fff;--accent-soft:#D9E8FB;--good:#17753F;--warn:#935300;--good-soft:#D6EFDD;--warn-soft:#F7E7C8;--r:12px;--rs:8px;--f-d:'Sora',system-ui,sans-serif}
[data-tema=senja]{--bg:#0D1322;--surface:#151D33;--surface2:#1B2540;--fg:#E9EDF8;--muted:#9AA6C4;--line:#2A3658;--accent:#F2B544;--accent-fg:#1A1200;--accent-soft:#3A2F12;--good:#5BD49A;--warn:#F2B544;--bad:#FF8A80;--good-soft:#12362A;--warn-soft:#3A2F12;--bad-soft:#40201F;--r:10px;--rs:7px;color-scheme:dark}
[data-tema=mawar]{--bg:#F3ECF0;--surface:#fff;--surface2:#FAF5F8;--fg:#2A1420;--muted:#6B5260;--line:#E2D2DB;--accent:#B01E5B;--accent-fg:#fff;--accent-soft:#F6D9E6;--good:#17753F;--warn:#935300;--good-soft:#D6EFDD;--warn-soft:#F7E7C8;--r:16px;--rs:10px;--f-d:'Fraunces',Georgia,serif}
[data-tema=kontras]{--bg:#fff;--surface:#fff;--surface2:#F0F0F0;--fg:#000;--muted:#2B2B2B;--line:#000;--accent:#000;--accent-fg:#fff;--accent-soft:#FFE600;--good:#006400;--warn:#7A4A00;--bad:#B00020;--good-soft:#CFF5CF;--warn-soft:#FFE9A8;--bad-soft:#FFD0D6;--r:2px;--rs:2px;--bw:2px;--f-d:'IBM Plex Mono',monospace}
:root{--fs:15px}[data-fs=s]{--fs:14px}[data-fs=l]{--fs:17px}
*{box-sizing:border-box}html{font-size:var(--fs)}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:1rem/1.5 var(--f-b);padding:0 max(16px,env(safe-area-inset-left,0px));-webkit-text-size-adjust:100%}
.wrap{max-width:880px;margin:0 auto}
h1,h2,h3{font-family:var(--f-d);margin:0;letter-spacing:-.01em}
h1{font-size:1.35rem;font-weight:800;line-height:1.15}h2{font-size:1.13rem;font-weight:700}
h3{font-size:.9rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-m);font-variant-numeric:tabular-nums;white-space:nowrap}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 0;border-bottom:var(--bw) solid var(--line)}
.sub{display:block;font-size:.8rem;color:var(--muted);background:none;border:0;padding:0;text-align:left;cursor:pointer}
.sub .dot{display:inline-block;width:.55em;height:.55em;border-radius:50%;margin-right:.4em;background:var(--muted)}
.sub.ok .dot{background:var(--good)}.sub.wait .dot{background:var(--warn)}.sub.err .dot{background:var(--bad)}
.mon{display:flex;align-items:center;gap:4px;font-family:var(--f-d);font-weight:700}
.mon strong{min-width:7.5rem;text-align:center}
.mon button{width:2.4rem;height:2.4rem;border:var(--bw) solid var(--line);background:var(--surface);border-radius:var(--rs);cursor:pointer;font-size:1.2rem}
main{padding:16px 0 104px;display:grid;gap:16px}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.stack{display:grid;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row.sb{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:.87rem}
.sect{font-family:var(--f-d);font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);border-bottom:var(--bw) solid var(--line);padding-bottom:4px}
label.f{display:grid;gap:4px;font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
input,select,textarea{width:100%;min-width:0;padding:.6rem .65rem;border:var(--bw) solid var(--line);border-radius:var(--rs);background:var(--surface2);font-size:max(16px,1rem);font-weight:400}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:4.5rem}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.moneyin{display:flex;align-items:center;border:var(--bw) solid var(--line);border-radius:var(--rs);background:var(--surface2);padding-left:.6rem;overflow:hidden}
.moneyin>b{font-size:.87rem;font-weight:800;color:var(--muted);padding-right:.35rem}
.moneyin>input{border:0;background:transparent;padding-left:0;font-family:var(--f-m);font-weight:700}
.moneyin:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.btn{border:var(--bw) solid var(--line);background:var(--surface);padding:.6rem .9rem;border-radius:var(--rs);font-weight:600;cursor:pointer;font-size:.93rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:.4rem .7rem;font-size:.87rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
a.btn{text-decoration:none;display:inline-block}
.seg{display:flex;border:var(--bw) solid var(--line);border-radius:var(--rs);overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface2);padding:.6rem .4rem;cursor:pointer;font-weight:600;border-right:var(--bw) solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:.4rem .7rem;border:var(--bw) solid var(--line);background:var(--surface);border-radius:var(--rs);font-size:.87rem;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pat{display:grid;grid-template-columns:repeat(3,3.3rem);gap:10px}
.pat button{width:3.3rem;height:3.3rem;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-family:var(--f-m);font-weight:700;cursor:pointer;color:var(--muted)}
.pat button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.notaimg{display:block;width:100%;max-width:420px;height:auto;margin:0 auto;border:1px solid #bbb;background:#fff}
.sigbox{border:1px dashed var(--line);border-radius:var(--rs);padding:6px;display:grid;gap:6px}
.sigcanvas{width:100%;height:130px;background:#fff;border:var(--bw) solid var(--line);border-radius:4px;touch-action:none;display:block;cursor:crosshair}
.sigimg{max-width:150px;height:auto;border:1px solid var(--line);background:#fff;border-radius:4px}
.item{border:var(--bw) solid var(--line);border-radius:var(--rs);padding:10px;background:var(--surface2);display:grid;gap:8px}
.item-h{display:flex;justify-content:space-between;align-items:center}
.item-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:8px}
.item-g .f-name{grid-column:1/-1}
.tag{font-size:.73rem;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:4px}
.tag.jasa{background:var(--accent-soft);color:var(--accent)}.tag.part{background:var(--warn-soft);color:var(--warn)}
.linkbtn{background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;font-size:.87rem;padding:4px}
.ledger{display:grid;font-size:.93rem}
.ledger .ln{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.ledger .ln>span:first-child{min-width:0;overflow-wrap:anywhere}.ledger .ln>span:last-child{text-align:right}
.ledger .ln.tot{border-bottom:2px solid var(--fg);font-weight:700}
.ledger .ln.sub{color:var(--muted);font-size:.87rem;padding-left:12px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.big{font-family:var(--f-d);font-size:2rem;font-weight:800;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px}
.stat{border:var(--bw) solid var(--line);border-radius:var(--rs);padding:10px 4px;text-align:center;background:var(--surface2)}
.stat b{display:block;font-size:1.6rem;font-family:var(--f-d);line-height:1.1}.stat span{font-size:.78rem;color:var(--muted);font-weight:600}
.stat.warn b{color:var(--warn)}.stat.good b{color:var(--good)}.stat.bad b{color:var(--bad)}
.nota{font-family:var(--f-m);font-size:.87rem;white-space:pre;overflow-x:auto;background:var(--surface2);border:1px dashed var(--muted);border-radius:4px;padding:14px;margin:0}
.nota.wrapit{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--f-b);font-size:.93rem}
.badge{display:inline-block;padding:2px 9px;border-radius:4px;font-size:.8rem;font-weight:700}
.badge.good{background:var(--good-soft);color:var(--good)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.mute{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.bar{height:.55rem;background:var(--surface2);border:var(--bw) solid var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}.bar.bad>i{background:var(--bad)}
.tx{border-top:var(--bw) solid var(--line);padding:12px 0;display:grid;gap:12px}.tx:first-child{border-top:0;padding-top:0}
.tx.cancelled .tx-title{text-decoration:line-through;color:var(--muted)}
.tx-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;cursor:pointer;background:none;border:0;text-align:left;width:100%;padding:0}
.tx-h>span{min-width:0}
.box{border:var(--bw) solid var(--line);border-radius:var(--rs);padding:12px;display:grid;gap:10px;background:var(--surface2)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 8px;text-align:left;border-bottom:var(--bw) solid var(--line)}
th{font-size:.75rem;text-transform:uppercase;color:var(--muted)}td.r,th.r{text-align:right}
tr.totrow td{font-weight:700;border-top:2px solid var(--fg)}
.empty{text-align:center;padding:28px 12px;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty strong{color:var(--fg);font-family:var(--f-d);font-size:1.13rem}
.thms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.thm{display:grid;gap:8px;padding:10px;border:2px solid var(--line);border-radius:var(--rs);text-align:left;cursor:pointer;background:var(--surface)}
.thm[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.thm .pv{display:grid;gap:6px;padding:10px;border-radius:4px;border:1px solid rgba(128,128,128,.35)}
.thm .pv i{display:block;height:.5rem;border-radius:3px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:var(--bw) solid var(--line);padding:0 8px env(safe-area-inset-bottom,0px)}
.tabs-in{display:flex}
.tab{flex:1;min-width:0;padding:12px 2px 11px;background:none;border:0;border-top:3px solid transparent;font-weight:600;font-size:.83rem;color:var(--muted);cursor:pointer}
.tab[aria-current=page]{color:var(--accent);border-top-color:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:var(--rs);font-size:.93rem;z-index:20;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .15s}
#toast.on{opacity:1}
@media (min-width:700px){h1{font-size:1.6rem}}
.t7 .tab{font-size:.72rem;padding-left:0;padding-right:0}
.gal{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;width:92px;height:92px;border:var(--bw) solid var(--line);border-radius:var(--rs);overflow:hidden;background:var(--surface2);display:grid;place-items:center;font-size:.72rem;color:var(--muted);text-align:center;padding:0;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ovl{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px}
.ovl-bg{position:absolute;inset:0;background:rgba(0,0,0,.78)}
.ovl-in{position:relative;display:grid;gap:12px;max-width:min(96vw,720px);max-height:96vh;justify-items:center}
.ovl-in img{max-width:100%;max-height:78vh;border-radius:8px;background:#fff}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:10px var(--f-b)}
#printarea{display:none}
.rp{font:12px/1.45 'IBM Plex Sans',Arial,sans-serif;color:#111;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rp h1{font-size:20px;margin:0;color:#0B7A5A}
.rp h2{font-size:13px;margin:16px 0 6px;padding-bottom:3px;border-bottom:1.5px solid #0B7A5A;color:#0B7A5A;letter-spacing:0;font-family:inherit}
.rp-h{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid #0B7A5A;padding-bottom:8px;font-size:12px}
.rp table{width:100%;border-collapse:collapse;font-size:11.5px}
.rp td,.rp th{border-bottom:1px solid #ddd;padding:4px 6px;text-align:left}
.rp th{background:#eef5f1;font-size:10.5px;text-transform:uppercase;color:#333}
.rp .r{text-align:right}.rp tr.tot td{border-top:1.5px solid #111;font-weight:700}
.rp .note{font-size:11px;color:#555;margin:4px 0}
.rp-sign{display:flex;justify-content:space-between;margin-top:28px;font-size:12px}
.rp-foot{margin-top:18px;font-size:10px;color:#777;text-align:center}
.rp .chart text{fill:#333}
.rp h2,.rp table,.rp-chart,.rp-sign{break-inside:avoid}
@page{size:A4;margin:14mm}
@media print{body.pr-rep>#app,body.pr-rep>#toast{display:none!important}body.pr-rep #printarea{display:block}body.pr-rep{background:#fff!important;padding:0!important}}

/* ===== v10: tampilan baru (bengkel rapi: header gelap, form bernomor, kartu nota bergaris status, nav berikon) ===== */
:root,[data-tema=hijau],[data-tema=samudra],[data-tema=mawar]{--hdr:#0F1F1A;--hdr-fg:#F2F7F4;--hdr-mute:rgba(242,247,244,.68);--hdr-line:rgba(255,255,255,.14)}
[data-tema=samudra]{--hdr:#0B1B30}[data-tema=mawar]{--hdr:#2A1220}
[data-tema=malam],[data-tema=senja]{--hdr:var(--surface2);--hdr-fg:var(--fg);--hdr-mute:var(--muted);--hdr-line:var(--line)}
[data-tema=kontras]{--hdr:#000;--hdr-fg:#fff;--hdr-mute:#e6e6e6;--hdr-line:#fff}
:root{--r:16px;--rs:12px;--lift:0 1px 2px rgba(15,31,26,.05),0 10px 24px -14px rgba(15,31,26,.28)}
[data-tema=malam],[data-tema=senja],[data-tema=kontras]{--lift:none}
body{background:var(--bg)}
/* header */
.top{position:sticky;top:0;z-index:7;margin:0 -16px;padding:14px 16px 12px;background:var(--hdr);color:var(--hdr-fg);border-bottom:0;border-radius:0 0 20px 20px;box-shadow:0 10px 24px -16px rgba(0,0,0,.5);align-items:center}
.top h1{color:var(--hdr-fg);font-size:1.3rem;letter-spacing:-.02em}
.top .sub{color:var(--hdr-mute);font-size:.78rem;margin-top:2px}
.top .sub .dot{background:var(--hdr-mute)}.top .sub.ok .dot{background:#4ADE9B}.top .sub.wait .dot{background:#F5B94A}.top .sub.err .dot{background:#FF8A80}
.top .muted{color:var(--hdr-mute)}
.top .btn{background:transparent;color:var(--hdr-fg);border-color:var(--hdr-line)}
.top .btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.top .mon button{background:transparent;color:var(--hdr-fg);border-color:var(--hdr-line)}
.top .mon strong{color:var(--hdr-fg)}
main{padding-top:18px}
/* kartu */
.card{border-radius:var(--r);box-shadow:var(--lift);padding:18px}
.card>h2,.card .row.sb>h2{font-size:1.08rem;letter-spacing:-.01em}
h3{text-transform:none;letter-spacing:0;font-size:.98rem;font-weight:700;color:var(--fg)}
.box{border-radius:14px;background:var(--surface2)}
.box>h3{display:flex;align-items:center;gap:8px}
.box>h3::before{content:"";width:4px;height:1em;border-radius:2px;background:var(--accent);flex:none}
/* label & input */
label.f{text-transform:none;letter-spacing:0;font-size:.84rem;font-weight:600;color:var(--muted)}
input,select,textarea{border-radius:var(--rs);padding:.72rem .8rem;background:var(--surface);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:0}
.moneyin{border-radius:var(--rs);background:var(--surface)}
.moneyin>input{padding-top:.72rem;padding-bottom:.72rem}
/* tombol */
.btn{border-radius:var(--rs);padding:.7rem 1rem;min-height:44px;transition:transform .08s,border-color .15s,background .15s}
.btn.sm{min-height:38px;padding:.45rem .8rem}
.btn:active{transform:scale(.97)}
.btn.pri{box-shadow:0 6px 14px -8px var(--accent)}
.seg{border-radius:var(--rs);padding:3px;gap:3px;background:var(--surface2)}
.seg button{border:0;border-radius:9px;background:transparent;padding:.65rem .4rem;min-height:44px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);box-shadow:0 4px 10px -6px var(--accent)}
.chip{border-radius:999px;min-height:40px;padding:.45rem .9rem;background:var(--surface);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]::before{content:"✓";font-weight:800}
.chip:active{transform:scale(.97)}
/* form bernomor: langkah penerimaan unit */
.formcard{counter-reset:st}
.formcard .sect{counter-increment:st;display:flex;align-items:center;gap:10px;margin-top:10px;padding:14px 0 8px;border-bottom:var(--bw) solid var(--line);font-size:1.02rem;font-weight:800;text-transform:none;letter-spacing:-.01em;color:var(--fg)}
.formcard .sect::before{content:counter(st);display:grid;place-items:center;flex:none;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:.85rem;font-weight:800}
.formcard .sect:first-of-type{margin-top:0;padding-top:4px}
.savebar{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:4;display:grid;gap:6px}
.savebar .btn.pri{width:100%;min-height:54px;font-size:1.05rem;border-radius:14px;box-shadow:0 14px 28px -12px var(--accent)}
.sect{font-size:.95rem;text-transform:none;letter-spacing:0;color:var(--fg);font-weight:800}
/* item */
.item{border-radius:14px;background:var(--surface2)}
.tag{border-radius:999px;text-transform:none;font-size:.78rem;padding:3px 10px}
/* badge status */
.badge{border-radius:999px;padding:3px 11px;display:inline-flex;align-items:center;gap:6px}
.badge::before{content:"";width:.5em;height:.5em;border-radius:50%;background:currentColor;opacity:.85}
/* daftar nota: tiket dengan garis status */
.tx{border:var(--bw) solid var(--line);border-left:6px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 12px 12px 14px;margin:0 0 10px;box-shadow:var(--lift)}
.tx:first-child{padding-top:12px}.tx:last-child{margin-bottom:0}
.tx.st-diterima{border-left-color:#8A96A3}.tx.st-dikerjakan{border-left-color:#2F7DE1}.tx.st-menunggu-konfirmasi{border-left-color:#E0A21B}
.tx.st-selesai{border-left-color:#17A36B}.tx.st-diambil{border-left-color:var(--accent)}.tx.st-dibatalkan{border-left-color:var(--bad)}
.tx-title strong.num{font-size:1.02rem}
/* statistik & buku besar */
.stat{border-radius:14px;background:var(--surface2);padding:12px 4px}
.stat b{font-size:1.7rem}
.ledger .ln{padding:9px 0}
.big{letter-spacing:-.03em}
/* nav bawah */
.tabs{background:var(--surface);border-top:0;box-shadow:0 -10px 30px -18px rgba(15,31,26,.45);border-radius:20px 20px 0 0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{display:grid;justify-items:center;gap:3px;padding:7px 2px 6px;border:0;border-radius:14px;font-size:.72rem;font-weight:600;line-height:1.1;transition:background .15s,color .15s}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{background:var(--accent-soft);color:var(--accent);border-top-color:transparent}
.t7 .tab{font-size:.66rem}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{border-radius:14px;bottom:calc(88px + env(safe-area-inset-bottom,0px));box-shadow:0 12px 28px -12px rgba(0,0,0,.5)}
.empty{border:var(--bw) dashed var(--line);border-radius:var(--r);padding:34px 14px}
.sigbox{border-radius:var(--rs)}.sigcanvas{border-radius:10px}
.thm{border-radius:14px}
a.btn{display:inline-flex;align-items:center}
@media (min-width:880px){.top{margin:0 auto;max-width:880px;border-radius:0 0 22px 22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.tabs,.top,.savebar{display:none!important}}
.t8 .tabs-in{overflow-x:auto;scrollbar-width:none}.t8 .tab{flex:1 0 auto;min-width:62px}

function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x;}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return iso(d);}

function moneyFix(el){
 var raw=el.value,pos=el.selectionStart==null?raw.length:el.selectionStart;
 var before=raw.slice(0,pos).replace(/\D/g,'').length;
 var digits=raw.replace(/\D/g,'').replace(/^0+(?=\d)/,'');
 var out=digits?(+digits).toLocaleString('id-ID'):'';el.value=out;
 var np=0,c=0;
 if(before>0){np=out.length;for(var i=0;i<out.length;i++){if(out.charCodeAt(i)>=48&&out.charCodeAt(i)<=57){c++;if(c===before){np=i+1;break;}}}}
 try{el.setSelectionRange(np,np);}catch(e){}
 return digits?+digits:0;}

function warr(t){
 var n=+t.warrantyDays||0;if(!n||!isActive(t))return null;

 var start=finDate(t),until=addDays(start,n),left=diffDays(iso(new Date()),until);

function rebuild(){
 txs=[];exps=[];kass=[];stks=[];abss=[];_usedC=null;var c=null;
 Object.keys(DOCS).forEach(function(k){var o=DOCS[k];if(!o||o.deleted)return;if(k.indexOf('tx/')===0)txs.push(o);else if(k.indexOf('exp/')===0)exps.push(o);else if(k.indexOf('kas/')===0)kass.push(o);else if(k.indexOf('stk/')===0)stks.push(o);else if(k.indexOf('abs/')===0)abss.push(o);else if(k==='cfg/main')c=o;});
 cfg=Object.assign(defaultCfg(),c||{});

 cfg.staff.forEach(function(s){
  if(s.role==='admin'){s.share=0;s.fee=0;s.base=+s.base||0;}

function wkStart(d){var x=pd(d),dw=(x.getDay()+6)%7;x.setDate(x.getDate()-dw);return iso(x);}
function wkNo(st){var x=pd(st);x.setDate(x.getDate()+3);var y=x.getFullYear(),j=new Date(y,0,4),w=1+Math.round(((x-j)/86400000-3+((j.getDay()+6)%7))/7);return{y:y,w:w};}
function rkAgg(){return{n:0,refundN:0,total:0,partCost:0,net:0,bh:0,fee:0,tech:0,shop:0,exp:0,claim:0,byTech:{},cats:{}};}
function rkCompute(){
 var D={},W={},M={};
 function g(o,k){return o[k]||(o[k]=rkAgg());}
 function each(d,fn){fn(g(D,d));fn(g(W,wkStart(d)));fn(g(M,d.slice(0,7)));}
 txs.forEach(function(t){
  if(isActive(t)&&isPaid(t)){var c=calc(t);each(payDate(t),function(a){a.n++;a.total+=c.total;a.partCost+=c.partCost;a.net+=c.net;a.bh+=c.bh;a.fee+=c.feeAmt;a.tech+=c.tech;a.shop+=c.shop;a.byTech[t.techId]=(a.byTech[t.techId]||0)+c.tech;});}
  (t.claims||[]).forEach(function(cl){if(!claimOK(cl)||!cl.date)return;var r=calc(t);
   if(cl.result===REFUND)each(cl.date,function(a){a.refundN++;a.total-=r.total;a.partCost-=r.partCost;a.net-=r.net;a.bh-=r.bh;a.fee-=r.feeAmt;a.tech-=r.tech;a.shop-=r.shop;a.claim+=r.partCost;a.byTech[t.techId]=(a.byTech[t.techId]||0)-r.tech;});
   else each(cl.date,function(a){a.claim+=+cl.cost||0;});});});

function initSigPad(){
 var cv=document.getElementById('sig-canvas');if(!cv)return;
 var r=cv.getBoundingClientRect();cv.width=Math.max(200,Math.round(r.width));cv.height=130;
 var x=cv.getContext('2d');x.strokeStyle='#111';x.lineWidth=2.5;x.lineCap='round';x.lineJoin='round';
 if(draft.signature){var im=new Image();im.onload=function(){x.drawImage(im,0,0,cv.width,cv.height);};im.src=draft.signature;}
 var pos=function(e){var b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top];};
 cv.onpointerdown=function(e){sigPad.drawing=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}var p=pos(e);x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+0.1,p[1]);x.stroke();e.preventDefault();};
 cv.onpointermove=function(e){if(!sigPad.drawing)return;var p=pos(e);x.lineTo(p[0],p[1]);x.stroke();e.preventDefault();};
 var end=function(){if(!sigPad.drawing)return;sigPad.drawing=false;
  var s=document.createElement('canvas');s.width=300;s.height=100;var sc=s.getContext('2d');sc.fillStyle='#fff';sc.fillRect(0,0,300,100);sc.drawImage(cv,0,0,300,100);
  draft.signature=s.toDataURL('image/png');};
 cv.onpointerup=end;cv.onpointercancel=end;}

function sopNeed(){return SOP_VER+'.'+(+cfg.sopRev||0);}
function sopRec(){try{return JSON.parse(localStorage.getItem('kp-sop-'+(AUTH&&AUTH.user))||'null');}catch(e){return null;}}
function sopSaveRec(r){try{localStorage.setItem('kp-sop-'+AUTH.user,JSON.stringify(r));}catch(e){}}
function sopDays(){var d=cfg.sopDays;return d==null?30:+d||0;}
function sopFresh(r,days){return !!r&&r.ver===sopNeed()&&(!days||(Date.now()-(+r.at||0))<days*86400000);}
function sopOKv(){return sopFresh(sopRec(),sopDays());}
function needSop(){return isTech()&&!sopOKv();}
function sopLeft(){var r=sopRec(),d=sopDays();if(!r||!d||r.ver!==sopNeed())return null;return Math.ceil((r.at+d*86400000-Date.now())/86400000);}
function sopBoot(){
 /* Ambil status baca dari server (agar perangkat kedua tidak diminta ulang); jika gagal, pakai catatan di perangkat. */
 if(!hasServer())return;
 sopD.checking=true;
 var tm=new Promise(function(res){setTimeout(function(){res(null);},7000);});
 Promise.race([api({action:'sop_me'}).catch(function(){return null;}),tm]).then(function(r){
  sopD.checking=false;
  if(r&&r.ok&&r.ver){var loc=sopRec();if(!loc||(+r.at||0)>(+loc.at||0))sopSaveRec({ver:r.ver,at:+r.at||Date.now()});}
  render();sopFlush();});}
function sopFlush(){
 var r=sopRec();if(!r||!r.pending||!hasServer())return;
 api({action:'sop_ack',ver:r.ver}).then(function(x){if(x&&x.ok){var c=sopRec();if(c&&c.pending&&c.ver===r.ver)sopSaveRec({ver:c.ver,at:+x.at||c.at});}}).catch(function(){});}
function sopAck(){
 if(sopD.busy||!sopReady())return;
 sopD.busy=true;sopD.err='';sopUpdate();
 var need=sopNeed();
 var done=function(rec,msg){sopD.busy=false;sopSaveRec(rec);sopD.quiz={};sopD.checked=false;sopD.reached=false;sopD.t0=0;tab='t-ringkas';render();window.scrollTo(0,0);toast(msg);};
 api({action:'sop_ack',ver:need}).then(function(r){
  if(r&&r.ok)done({ver:need,at:+r.at||Date.now()},'Terima kasih. Persetujuan SOP Anda tercatat.');
  else if(r&&r.error==='auth'){sopD.busy=false;sessionExpired();}
  else done({ver:need,at:Date.now(),pending:true},'Tersimpan di perangkat. Server belum diperbarui atau sedang tidak terjangkau.');
 }).catch(function(){done({ver:need,at:Date.now(),pending:true},'Tersimpan di perangkat dan akan dikirim saat tersambung internet.');});}

function sopUpdate(){
 if(!sopOn)return;
 var de=document.documentElement,left=de.scrollHeight-(window.scrollY+window.innerHeight);
 if(left<90)sopD.reached=true;
 var sec=Math.max(0,SOP_MIN-Math.floor((Date.now()-(sopD.t0||Date.now()))/1000));
 var okq=0;SOP_QUIZ.forEach(function(q,i){var fb=document.getElementById('sq-fb-'+i),cur=sopD.quiz[i];
  if(cur!=null&&+cur===q.a)okq++;
  if(fb){fb.textContent=cur==null?'':(+cur===q.a?'✔ Benar. '+q.why:'✖ Belum tepat, coba lagi.');fb.style.color=cur==null?'':(+cur===q.a?'var(--good)':'var(--bad)');}});
 var need=[];if(!sopD.reached)need.push('gulir sampai bawah');if(sec>0)need.push('tunggu '+sec+' dtk');if(okq<SOP_QUIZ.length)need.push('jawab benar '+okq+'/'+SOP_QUIZ.length);if(!sopD.checked)need.push('centang persetujuan');
 var pg=document.getElementById('sop-prog'),bt=document.getElementById('sop-btn');
 if(pg)pg.textContent=sopD.busy?'Menyimpan…':(need.length?'Tersisa: '+need.join(' · '):'Semua syarat terpenuhi.');
 if(bt)bt.disabled=!sopReady();}
function sopStart(){
 var on=!!AUTH&&needSop()&&!sopD.checking;
 if(on&&!sopOn){sopOn=true;clearInterval(sopT);sopT=setInterval(sopUpdate,1000);}
 if(!on&&sopOn){sopOn=false;clearInterval(sopT);}
 if(on)setTimeout(sopUpdate,0);}

async function doLogin(){
 if(loginD.busy)return;
 var url=(loginD.editUrl||!SYNC.url?loginD.url:SYNC.url).trim(),u=String(loginD.user||'').trim().toLowerCase(),p=loginD.pass||'';
 if(!/^https:\/\/script\.google\.com\//.test(url)){loginD.err='Alamat server harus diawali https://script.google.com/';render();return;}
 if(!u||!p){loginD.err='Isi username dan sandi.';render();return;}
 if(loginD.devname!=null){try{localStorage.setItem('kp-devname',String(loginD.devname).trim().slice(0,40));}catch(e){}}
 loginD.busy=true;loginD.err='';render();
 try{
  var r=await post(url,{action:'login',user:u,pass:p});
  if(!r||!r.ok){loginD.busy=false;loginD.err=errMsg(r&&r.error);loginD.pass='';render();return;}
  var nsr=(r.role==='teknisi'||r.role==='front'),key='kp-sync'+(nsr?'-'+r.user:''),o={};

function trkCode(){var A='abcdfghjkmnpqrstuvwxyz23456789',s='',b=new Uint8Array(10);try{crypto.getRandomValues(b);}catch(e){for(var i=0;i<10;i++)b[i]=Math.floor(Math.random()*256);}for(var j=0;j<10;j++)s+=A.charAt(b[j]%A.length);return s;}
function scriptId(){var m=/\/macros\/s\/([^\/]+)\/exec/.exec(SYNC.url||'');return m?m[1]:'';}
function trkLink(t){var id=scriptId();if(!id||!t||!t.trk)return'';return location.origin+location.pathname.replace(/[^\/]*$/,'')+'lacak.html?s='+id+'&c='+t.trk;}

function trkBox(t){

function qrMatrix(text){
 try{for(var v=1;v<=14;v++){try{var q=new QRCode(v,1);q.addData(text);q.make();var n=q.getModuleCount(),m=[];for(var r=0;r<n;r++){m.push([]);for(var c=0;c<n;c++)m[r].push(q.isDark(r,c));}return m;}catch(e){if(!/overflow/i.test(String(e&&e.message||e)))throw e;}}}catch(e){}
 return null;}

/* ---------- Foto unit ---------- */
function picKey(id,n){return id+':'+n;}
function picPutLocal(k,d){return new Promise(function(res){if(!IDB)return res(false);try{var tx=IDB.transaction('pics','readwrite');tx.objectStore('pics').put({k:k,d:d});tx.oncomplete=function(){res(true);};tx.onerror=tx.onabort=function(){res(false);};}catch(e){res(false);}});}
function picGetLocal(k){return new Promise(function(res){if(!IDB)return res(null);try{var q=IDB.transaction('pics','readonly').objectStore('pics').get(k);q.onsuccess=function(){res(q.result?q.result.d:null);};q.onerror=function(){res(null);};}catch(e){res(null);}});}
function picDelLocal(k){try{if(IDB)IDB.transaction('pics','readwrite').objectStore('pics').delete(k);}catch(e){}delete PIC[k];}
function compressImg(file,max,q){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var w=im.naturalWidth,h=im.naturalHeight,sc=Math.min(1,max/Math.max(w,h)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*sc));cv.height=Math.max(1,Math.round(h*sc));var x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',q));};im.onerror=rej;im.src=fr.result;};fr.onerror=rej;fr.readAsDataURL(file);});}
async function picLoad(t,ph){

 if(d){PIC[k]=d;if(!typing()&&!sigPad.drawing)render();}
 setTimeout(function(){delete PICREQ[k];},d?3600000:60000);}

function shortRp(n){var a=Math.abs(n),s=n<0?'-':'';if(a>=1e9)return s+(a/1e9).toFixed(1).replace('.',',')+'M';if(a>=1e6)return s+(a/1e6).toFixed(a>=1e7?0:1).replace('.',',')+'jt';if(a>=1e3)return s+Math.round(a/1e3)+'rb';return s+Math.round(a);}

function barChart(labels,series,o){
 o=o||{};var W=360,H=190,L=44,R=8,T=14,B=26,iw=W-L-R,ih=H-T-B,mx=0,mn=0,fmt=o.fmt||shortRp,i;
 series.forEach(function(s){s.vals.forEach(function(v){if(v>mx)mx=v;if(v<mn)mn=v;});});
 mx=niceMax(mx);if(mn<0)mn=-niceMax(-mn);
 var rg=mx-mn,yv=function(v){return T+ih*(1-(v-mn)/rg);},gw=iw/labels.length,bw=Math.min(26,(gw-8)/series.length);
 var svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'Grafik')+'">';
 for(i=0;i<=4;i++){var gv=mn+rg*i/4,gy=yv(gv);svg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+gy+'" y2="'+gy+'" style="stroke:'+(o.grid||'var(--line)')+'" stroke-width=".7" stroke-dasharray="2 3"/><text x="'+(L-4)+'" y="'+(gy+3)+'" text-anchor="end">'+esc(fmt(gv))+'</text>';}
 labels.forEach(function(lb,k){var gx=L+gw*k+gw/2;
  series.forEach(function(s,j){var v=s.vals[k]||0,bx=gx-bw*series.length/2+bw*j,y0=yv(0),y1=yv(v);
   svg+='<rect x="'+bx.toFixed(1)+'" y="'+Math.min(y0,y1).toFixed(1)+'" width="'+(bw-2).toFixed(1)+'" height="'+Math.max(1,Math.abs(y1-y0)).toFixed(1)+'" rx="2" style="fill:'+s.color+'"><title>'+esc(s.name+' · '+lb+': '+(o.fmt?fmt(v):rp(v)))+'</title></rect>';});
  svg+='<text x="'+gx.toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle">'+esc(lb)+'</text>';});
 svg+='</svg><div class="row small" style="gap:12px">'+series.map(function(s){return'<span style="display:inline-flex;align-items:center;gap:5px"><i style="width:10px;height:10px;border-radius:2px;display:inline-block;background:'+s.color+'"></i>'+esc(s.name)+'</span>';}).join('')+'</div>';
 return svg;}

function srvErr(r){var e=r&&r.error;if(e==='auth')return'auth';if(/^(action|forbidden)$/.test(e||''))return'Skrip Google belum versi terbaru. Tempel Code.gs terbaru lalu Deploy versi baru.';return e?String(e).slice(0,160):'Gagal memuat.';}
function bkpLoad(){
 if(!hasServer()){BKP.err='Belum terhubung ke server.';render();return;}
 BKP.busy=true;BKP.err='';render();
 api({action:'backup_info'}).then(function(r){BKP.busy=false;if(r&&r.ok)BKP.info=r;else{var m=srvErr(r);if(m==='auth'){sessionExpired();return;}BKP.err=m;}render();}).catch(function(){BKP.busy=false;BKP.err='Tidak dapat menghubungi server.';render();});}
function bkpCall(action,okMsg){
 if(!hasServer()){toast('Belum terhubung ke server.');return;}
 BKP.busy=true;BKP.err='';render();toast('Memproses…');
 api({action:action}).then(function(r){BKP.busy=false;if(r&&r.ok){BKP.info=r;toast(okMsg);logAct('Cadangan Drive',okMsg);}else{var m=srvErr(r);if(m==='auth'){sessionExpired();return;}BKP.err=m;toast('Gagal. '+m);}render();}).catch(function(){BKP.busy=false;BKP.err='Tidak dapat menghubungi server.';render();});}

 '<div class="row"><button class="btn pri sm" data-act="bk-now"'+(BKP.busy?' disabled':'')+'>Cadangkan sekarang</button><button class="btn sm" data-act="bk-on"'+(BKP.busy?' disabled':'')+'>Aktifkan cadangan harian</button><button class="btn sm" data-act="bk-load"'+(BKP.busy?' disabled':'')+'>Muat status</button></div>'+
 '<span class="small muted">Pertama kali setelah menempel Code.gs baru: di editor Apps Script pilih fungsi <b>izinkanAkses</b> › Jalankan › Izinkan (sekali saja), agar skrip boleh membuat salinan di Drive.</span></section>';}
